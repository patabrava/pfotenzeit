<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F0E8" />
    <title>Pfotenzeit – offline</title>
    <style>
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #f4f0e8; color: #2a2420; font: 16px/1.5 system-ui, sans-serif; padding: 1rem; box-sizing: border-box; }
      main { max-width: 28rem; display: grid; gap: .75rem; text-align: center; }
      h1 { font-size: 1.4rem; margin: 0; }
      button { min-height: 52px; font: inherit; border-radius: 12px; border: 1px solid #8a7a66; background: #326b58; color: #fff; padding: 0 1rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Pfotenzeit ist gerade offline</h1>
      <p>Beim ersten Start braucht das Spiel einmal eine Internetverbindung. Danach funktioniert es auch ohne.</p>
      <p>Dein Spielstand liegt sicher auf diesem Gerät.</p>
      <button type="button" onclick="location.reload()">Noch einmal versuchen</button>
    </main>
  </body>
</html>
