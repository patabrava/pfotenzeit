<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F0E8" />
    <link rel="icon" href="/icon.svg" />
    <title>Pfotenzeit – Renderer dev scene</title>
    <style>
      html, body { margin: 0; height: 100%; background: #F4F0E8; }
      #root { position: fixed; inset: 0; }
      /* ?strip=1: size the scene like the lesson strip between header and dialog (D-032). */
      body.strip #root { top: 64px; bottom: auto; height: clamp(140px, 27.5vh, 320px); }
      body.strip::before { content: ''; position: fixed; left: 0; right: 0; top: 0; height: 56px; background: #E9E2D3; }
      body.strip::after { content: ''; position: fixed; left: 0; right: 0; bottom: 0; top: calc(64px + clamp(140px, 27.5vh, 320px) + 8px); background: #E9E2D3; }
      body.review #root { position: static; inset: auto; width: max-content; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { mountDevScene } from '../devScene';
      import { mountReview } from './review';
      import { mountYardDev } from './yardDev';
      const params = new URLSearchParams(location.search);
      if (params.get('yard') === '1') {
        // D-041 yard harness: WASD / tap moves the handler, the dog follows; T toy, M moment, E exercise.
        window.__pfotenzeitYard = mountYardDev(document.getElementById('root'), { baseUrl: '/' });
      } else if (params.get('review') === '1') {
        // Hero review: ?review=1&a=<spec>&b=<spec>&cam=front|side|closeup_portrait|lesson_strip|landscape&light=neutral|courtyard[&pose=][&turn=1]
        document.body.classList.add('review');
        const review = mountReview(document.getElementById('root'), {
          baseUrl: '/',
          a: params.get('a') ?? 'procedural:dog.nala.puppy',
          b: params.get('b') ?? 'candidates:dog.nala.puppy',
          cam: params.get('cam') ?? undefined,
          light: params.get('light') ?? undefined,
          pose: params.get('pose') ?? undefined,
          turn: params.get('turn') === '1',
        });
        window.__pfotenzeitReview = review;
      } else {
        if (params.get('strip') === '1') document.body.classList.add('strip');
        const api = mountDevScene(document.getElementById('root'), {
          baseUrl: '/',
          controls: params.get('controls') !== '0' && params.get('strip') !== '1',
          manifest: params.get('manifest') ?? undefined,
        });
        window.__pfotenzeitDev = api;
      }
    </script>
  </body>
</html>
